<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Admin</title>
  </head>
  <body>
    <h1>Order Admin</h1>

    <form id="orderForm">
      <label for="item">Items (comma-separated)</label>
      <input type="text" id="item" placeholder="Pizza, Coke" required />

      <label for="paymentMethod">Payment Method</label>
      <input type="text" id="paymentMethod" placeholder="card" required />

      <label for="amount">Amount</label>
      <input
        type="number"
        id="amount"
        step="0.01"
        placeholder="25.50"
        required
      />

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" placeholder="2" required />

      <button type="submit">Create Order</button>
      <div id="status"></div>
    </form>

    <h2>All Orders</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Items</th>
          <th>Payment</th>
          <th>Amount</th>
          <th>Quantity</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <td>
          <button onclick="openEditDialog(${JSON.stringify(o)})">Edit</button>
        </td>
      </tbody>
    </table>

    <dialog id="editDialog">
      <h3>Edit Order</h3>
      <form id="editForm">
        <input type="hidden" id="editId" />

        <label for="editItem">Items (comma-separated)</label>
        <input type="text" id="editItem" />

        <label for="editPaymentMethod">Payment Method</label>
        <input type="text" id="editPaymentMethod" />

        <label for="editAmount">Amount</label>
        <input type="number" id="editAmount" step="0.01" />

        <label for="editQuantity">Quantity</label>
        <input type="number" id="editQuantity" />

        <button type="submit">Save</button>
        <button type="button" id="closeDialog">Cancel</button>
      </form>
    </dialog>

    <script>
      const API_BASE = "http://localhost:8080";

      async function loadOrders() {
        const res = await fetch(`${API_BASE}/orders`);
        const orders = await res.json();
        const body = document.getElementById("ordersBody");

        body.innerHTML = " ";
        orders.forEach((a) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${a.id}</td>
            <td>${(a.item || []).join(", ")}</td>
            <td>${a.paymentMethod}</td>
            <td>${a.amount}</td>
            <td>${a.quantity}</td>
          `;

          body.appendChild(row);
        });
      }

      function openEditDialog(order) {
        document.getElementById("editId").value = order.id;
        document.getElementById("editItem").value = (order.item || []).join(
          ", ",
        );
        document.getElementById("editPaymentMethod").value =
          order.paymentMethod;
        document.getElementById("editAmount").value = order.amount;
        document.getElementById("editQuantity").value = order.quantity;
        document.getElementById("editDialog").showModal();

        document.getElementById("closeDialog").addEventListener("click", () => {
          document.getElementById("editDialog").close();
        });
      }

      document
        .getElementById("orderForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const status = document.getElementById("status");
          status.textContent = "Saving...";
          status.className = " ";

          const payload = {
            item: document
              .getElementById("item")
              .value.split(",")
              .map((s) => s.trim())
              .filter(Boolean),
            paymentMethod: document.getElementById("paymentMethod").value,
            amount: parseFloat(document.getElementById("amount").value),
            quantity: parseInt(document.getElementById("quantity").value),
          };

          try {
            const res = await fetch(`${API_BASE}/orders`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!res.ok) throw new Error("Server returned " + res.status);
            status.textContent = "Order created!";
            status.className = "success";
            e.target.reset();
            loadOrders();
          } catch (err) {
            status.textContent = "Error: " + err.message;
            status.className = "error";
          }
        });

      loadOrders();
    </script>
  </body>
</html>
